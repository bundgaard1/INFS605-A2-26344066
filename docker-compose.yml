networks:
  osbourne-net:
    driver: bridge

services:
  api-gateway:
    image: nginx:alpine
    container_name: osbourne-api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - profile-service
      - notification-service
      - course-catalogue-service
      - frontend
    networks: 
      - osbourne-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: osbourne-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management Dashboard (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      # Korrekt exec-syntax for healthcheck i Compose
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - osbourne-net
    restart: unless-stopped

  profile-service:
    build:
      context: .
      dockerfile: ./profile-service/Dockerfile
    container_name: osbourne-profile-service
    environment:
      - PORT=50051
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes: 
      - ./profile-service/data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    container_name: osbourne-notification-service
    environment:
      - PORT=50052
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes: 
      - ./notification-service/data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  course-catalogue-service:
    build:
      context: .
      dockerfile: ./course-catalogue-service/Dockerfile
    container_name: osbourne-course-catalogue-service
    environment:
      - PORT=50053
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes: 
      - ./course-catalogue-service/data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: osbourne-frontend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PROFILE_SERVICE_ADDR=profile-service:50051
      - NOTIFICATION_SERVICE_ADDR=notification-service:50052
      - COURSE_CATALOGUE_SERVICE_ADDR=course-catalogue-service:50053
    depends_on:
      - profile-service
      - notification-service
      - course-catalogue-service
    networks:
      - osbourne-net
    restart: unless-stopped