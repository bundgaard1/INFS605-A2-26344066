networks:
  osbourne-net:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: osbourne-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - osbourne-net

  users-service:
    build:
      context: .
      dockerfile: ./users-service/Dockerfile
    container_name: osbourne-users-service
    environment:
      - PORT=50051
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - DB_PATH=/app/data/users.db
    volumes: 
      - ./users-service/data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: osbourne-frontend
    ports:
      - "8080:8080"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - USERS_SERVICE_ADDR=users-service:50051
    depends_on:
      rabbitmq:
        condition: service_healthy
      users-service:
        condition: service_started
    networks:
      - osbourne-net
    restart: unless-stopped