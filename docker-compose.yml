networks:
  osbourne-net:
    driver: bridge

services:
  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: 
      - osbourne-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: osbourne-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - osbourne-net

  profile-service:
    build:
      context: .
      dockerfile: ./profile-service/Dockerfile
    container_name: osbourne-profile-service
    environment:
      - PORT=50051
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes: 
      - ./profile-service/data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    container_name: osbourne-notification-service
    environment:
      - PORT=50052
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes: 
      - ./notification-service/data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - osbourne-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: osbourne-frontend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - PROFILE_SERVICE_ADDR=profile-service:50051
    depends_on:
      rabbitmq:
        condition: service_healthy
      profile-service:
        condition: service_started
    networks:
      - osbourne-net
    restart: unless-stopped