syntax = "proto3";

package student;

option go_package = "osbourne.local/frontend/gen/student;student";

service StudentService {
  rpc GetStudentProfile (StudentRequest) returns (StudentResponse);
}

message StudentRequest {
  string student_id = 1;
}

message Course {
  string id = 1;
  string title = 2;
}

message StudentResponse {
  string id = 1;
  string name = 2;
  string role = 3;
  repeated Course courses = 4;
}