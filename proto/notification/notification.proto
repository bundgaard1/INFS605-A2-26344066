syntax = "proto3";

package notification;

import "google/protobuf/timestamp.proto";

option go_package = "osbourne.local/notification-service/gen/notification;notification";

service NotificationService {
  rpc GetUserNotifications (NotificationsRequest) returns (NotificationsResponse);
  rpc MarkNotificationAsRead (MarkNotificationAsReadRequest) returns (MarkNotificationAsReadResponse);
}

message NotificationsRequest {
  string user_id = 1;
}


message NotificationsResponse {
  repeated Notification notifications = 1;
}

message MarkNotificationAsReadRequest {
  string notification_id = 1;
}

message MarkNotificationAsReadResponse {
  bool success = 1;
}

message Notification {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string msg = 4;
  string link = 5;
  bool isRead = 6;
  google.protobuf.Timestamp timestamp = 7;
}